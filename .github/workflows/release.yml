name: Build and Release UniPlan

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g., 1.0.0)"
        required: true
        default: "0.0.1"
      build_newest_code:
        description: "Build from latest code (alpha release)"
        type: boolean
        default: true
      build_android:
        description: "Build Android APK"
        type: boolean
        default: true
      build_ios:
        description: "Build iOS IPA"
        type: boolean
        default: true
      build_win_x64:
        description: "Build Windows x64"
        type: boolean
        default: true
      build_win_arm64:
        description: "Build Windows ARM64"
        type: boolean
        default: true
      build_mac_universal:
        description: "Build macOS"
        type: boolean
        default: true
      build_linux_x64:
        description: "Build Linux x64"
        type: boolean
        default: true
      build_linux_arm64:
        description: "Build Linux ARM64"
        type: boolean
        default: true
      update_metadata:
        description: "Update latest.json (Desktop Autoupdater)"
        type: boolean
        default: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      release_title: ${{ steps.vars.outputs.release_title }}
      tag_name: ${{ steps.vars.outputs.tag_name }}
      source_ref: ${{ steps.vars.outputs.source_ref }}
    steps:
      - id: vars
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          IF_ALPHA="${{ github.event.inputs.build_newest_code }}"
          DATE_TIME=$(date +'%d.%m.%Y-%H%M')

          if [ "$IF_ALPHA" = "true" ]; then
            RELEASE_TITLE="${DATE_TIME}"
            TAG_NAME="v${DATE_TIME}"
            SOURCE_REF="main"
          else
            RELEASE_TITLE="v$VERSION"
            TAG_NAME="v$VERSION"
            SOURCE_REF="v$VERSION"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_title=$RELEASE_TITLE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "source_ref=$SOURCE_REF" >> $GITHUB_OUTPUT

  build-desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win_x64
            os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
            build_flag: ${{ github.event.inputs.build_win_x64 }}
          - platform: win_arm64
            os: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
            build_flag: ${{ github.event.inputs.build_win_arm64 }}
          - platform: mac_universal
            os: macos-latest
            arch: arm64
            target: universal-apple-darwin
            build_flag: ${{ github.event.inputs.build_mac_universal }}
          - platform: linux_x64
            os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            build_flag: ${{ github.event.inputs.build_linux_x64 }}
          - platform: linux_arm64
            os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            build_flag: ${{ github.event.inputs.build_linux_arm64 }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Source
        if: matrix.build_flag == 'true'
        uses: actions/checkout@v6
        with:
          repository: dStudios-735453/UniPlan
          token: ${{ secrets.UNIPLAN_SOURCE_GITHUB }}
          path: source
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Setup Node
        if: matrix.build_flag == 'true'
        uses: actions/setup-node@v6
        with:
          cache: "npm"
          cache-dependency-path: source/package.json

      - name: Install Rust
        if: matrix.build_flag == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            ${{ matrix.platform == 'mac_universal'
              && 'aarch64-apple-darwin,x86_64-apple-darwin'
              || matrix.target }}

      - name: Rust Cache
        if: matrix.build_flag == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri -> target

      - name: Install Linux dependencies
        if: (matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm') && matrix.build_flag == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install NPM dependencies
        if: matrix.build_flag == 'true'
        working-directory: source
        run: npm install

      - name: Import Apple Developer Certificate
        if: matrix.build_flag == 'true' && matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE_MAC: ${{ secrets.APPLE_CERTIFICATE_MAC }}
          APPLE_CERTIFICATE_MAC_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_MAC_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE_MAC" | base64 --decode > $RUNNER_TEMP/certificate.p12

          security create-keychain -p temp apple.keychain
          security default-keychain -s apple.keychain
          security unlock-keychain -p temp apple.keychain

          security import $RUNNER_TEMP/certificate.p12 -k apple.keychain -P "$APPLE_CERTIFICATE_MAC_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-keychain-settings -lut 7200 apple.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp ~/Library/Keychains/apple.keychain-db

      - name: Build Tauri App
        if: matrix.build_flag == 'true'
        working-directory: source
        shell: bash
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_PATH: ${{ github.workspace }}/../_temp/certificate.p12
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_MAC_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }}

      - name: Build, Sign, and Notarize DMG
        if: matrix.build_flag == 'true' && matrix.os == 'macos-latest'
        shell: bash
        env:
          NOTARIZE_USER: ${{ secrets.APPLE_ID }}
          NOTARIZE_PASS: ${{ secrets.APPLE_ID_PASSWORD }}
          NOTARIZE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TARGET_ARCH: ${{ matrix.target }}
        run: |
          brew install create-dmg

          APP_VERSION=$(node -p "require('./source/package.json').version")
          DMG_FILENAME="UniPlan_${APP_VERSION}_universal.dmg"

          mkdir -p dmg_staging
          cp -r source/src-tauri/target/universal-apple-darwin/release/bundle/macos/UniPlan.app dmg_staging/

          xcrun notarytool store-credentials "ci-profile" \
            --apple-id "$NOTARIZE_USER" \
            --password "$NOTARIZE_PASS" \
            --team-id "$NOTARIZE_TEAM" \

          create-dmg \
            --volname "UniPlan" \
            --volicon "source/src-tauri/icons/icon.icns" \
            --background "source/src-tauri/icons/background_dmg.png" \
            --window-size 660 400 \
            --window-pos 200 200 \
            --icon-size 100 \
            --icon "UniPlan.app" 180 170 \
            --app-drop-link 480 170 \
            --hide-extension "UniPlan.app" \
            --codesign "$SIGNING_IDENTITY" \
            --notarize "ci-profile" \
            "$DMG_FILENAME" \
            dmg_staging/

          mkdir -p source/src-tauri/target/universal-apple-darwin/release/bundle/dmg
          mv "$DMG_FILENAME" source/src-tauri/target/universal-apple-darwin/release/bundle/dmg/

      - name: Upload Artifacts
        if: matrix.build_flag == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tauri-build-${{ matrix.platform }}
          path: |
            source/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            source/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe.sig
            source/src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            source/src-tauri/target/universal-apple-darwin/release/bundle/**/*.app
            source/src-tauri/target/universal-apple-darwin/release/bundle/**/*.app.tar.gz
            source/src-tauri/target/universal-apple-darwin/release/bundle/**/*.app.tar.gz.sig
            source/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            source/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage.sig
            source/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            source/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
          retention-days: 2

  build-mobile:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            build_flag: ${{ github.event.inputs.build_android }}
          - platform: ios
            os: macos-latest
            build_flag: ${{ github.event.inputs.build_ios }}
    runs-on: ${{ matrix.os }}
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
    steps:
      - name: Checkout Source
        if: matrix.build_flag == 'true'
        uses: actions/checkout@v6
        with:
          repository: dStudios-735453/UniPlan
          token: ${{ secrets.UNIPLAN_SOURCE_GITHUB }}
          path: source
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Setup Node
        if: matrix.build_flag == 'true'
        uses: actions/setup-node@v6
        with:
          cache: "npm"
          cache-dependency-path: source/package.json

      - name: Install NPM dependencies
        if: matrix.build_flag == 'true'
        working-directory: source
        run: npm install

      - name: Setup Expo and EAS
        if: matrix.build_flag == 'true'
        uses: expo/expo-github-action@v9
        with:
          expo-version: latest
          eas-version: latest
          eas-cache: true
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Setup Gradle
        if: matrix.platform == 'android' && matrix.build_flag == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android
        if: matrix.platform == 'android' && matrix.build_flag == 'true'
        working-directory: source
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: eas build --platform android --profile production --local --non-interactive

      - name: Prepare xcode
        if: matrix.platform == 'ios' && matrix.build_flag == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build iOS
        if: matrix.platform == 'ios' && matrix.build_flag == 'true'
        working-directory: source
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npx eas build --platform ios --profile production --local --non-interactive --auto-submit

      - name: Upload Android Artifact
        if: matrix.platform == 'android' && matrix.build_flag == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mobile-build-android
          path: |
            source/*.aab
            source/*.apk
            source/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 2

      - name: Upload iOS Artifact
        if: matrix.platform == 'ios' && matrix.build_flag == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mobile-build-ios
          path: source/*.ipa
          retention-days: 2

  create-release:
    needs: [prepare, build-desktop, build-mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate SHA-256 Checksums
        id: checksums
        run: |
          echo -e "### SHA-256 Checksums\n| Filename | SHA-256 Checksum |\n| --- | --- |" > checksums.txt

          shopt -s globstar nullglob
          for file in artifacts/**/*.{deb,tar.gz,dmg,exe,rpm,AppImage}; do
            [ -f "$file" ] || continue
            sha=$(sha256sum "$file")
            echo "| $(basename "$file") | \`${sha%% *}\` |" >> checksums.txt
          done

          EOF=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64 | tr -dc 'a-zA-Z0-9')
          {
            echo "hashes<<$EOF"
            cat checksums.txt
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.release_title }}
          draft: false
          prerelease: ${{ github.event.inputs.build_newest_code == 'true' }}
          body: ${{ steps.checksums.outputs.hashes }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.exe.sig
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.app.tar.gz.sig
            artifacts/**/*.AppImage
            artifacts/**/*.AppImage.sig
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.apk
            artifacts/**/*.aab
            artifacts/**/*.ipa
            artifacts/**/mapping.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}

  update-metadata:
    needs: [prepare, create-release]
    runs-on: ubuntu-latest
    if: github.event.inputs.update_metadata == 'true' && needs.create-release.result == 'success'
    steps:
      - name: Checkout Releases Repo
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all_artifacts

      - name: Update latest.json
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TAG="${{ needs.prepare.outputs.tag_name }}"
          REPO_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          # Helper to extract signature from file
          get_sig() {
            local pattern="$1"
            local sig_file=$(find all_artifacts -name "$pattern" | head -n 1)
            if [ -f "$sig_file" ]; then
              base64 -d "$sig_file" | sed -n '4p' | tr -d '\r\n '
            else
              echo ""
            fi
          }

          # Helper to get filename for URL
          get_filename() {
            local pattern="$1"
            local file_path=$(find all_artifacts -name "$pattern" | grep -v "\.sig$" | head -n 1)
            if [ -n "$file_path" ]; then
              basename "$file_path"
            else
              echo ""
            fi
          }

          # Get signatures and filenames for each platform
          # Windows
          W_X64_SIG=$(get_sig "UniPlan*x64*setup.exe.sig")
          W_X64_FILE=$(get_filename "UniPlan*x64*setup.exe")

          W_ARM_SIG=$(get_sig "UniPlan*arm64*setup.exe.sig")
          W_ARM_FILE=$(get_filename "UniPlan*arm64*setup.exe")

          # MacOS
          M_UNI_SIG=$(get_sig "*.app.tar.gz.sig")
          M_UNI_FILE=$(get_filename "*.app.tar.gz")

          # Linux
          L_X64_SIG=$(get_sig "UniPlan*amd64.AppImage.sig")
          L_X64_FILE=$(get_filename "UniPlan*amd64.AppImage")

          L_ARM_SIG=$(get_sig "UniPlan*aarch64.AppImage.sig")
          L_ARM_FILE=$(get_filename "UniPlan*aarch64.AppImage")

          # Construct the platforms object dynamically
          PLATFORMS=$(jq -n \
            --arg w_x64_sig "$W_X64_SIG" --arg w_x64_url "${REPO_URL}/${W_X64_FILE}" \
            --arg w_arm_sig "$W_ARM_SIG" --arg w_arm_url "${REPO_URL}/${W_ARM_FILE}" \
            --arg m_uni_sig "$M_UNI_SIG" --arg m_uni_url "${REPO_URL}/${M_UNI_FILE}" \
            --arg l_x64_sig "$L_X64_SIG" --arg l_x64_url "${REPO_URL}/${L_X64_FILE}" \
            --arg l_arm_sig "$L_ARM_SIG" --arg l_arm_url "${REPO_URL}/${L_ARM_FILE}" \
            '{
              "windows-x86_64": { "signature": $w_x64_sig, "url": $w_x64_url },
              "windows-aarch64": { "signature": $w_arm_sig, "url": $w_arm_url },
              "darwin-universal": { "signature": $m_uni_sig, "url": $m_uni_url },
              "linux-x86_64": { "signature": $l_x64_sig, "url": $l_x64_url },
              "linux-aarch64": { "signature": $l_arm_sig, "url": $l_arm_url }
            }')

          # Update latest.json using jq
          jq --arg ver "$VERSION" --arg date "$PUB_DATE" --argjson platforms "$PLATFORMS" \
            '.version = $ver | .pub_date = $date | .platforms = $platforms' \
            latest.json > latest.json.tmp && mv latest.json.tmp latest.json

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "chore: update latest.json for ${{ needs.prepare.outputs.tag_name }}"
          git push
