id: org.dstudios.uniplan
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: uniplan
separate-locales: false

finish-args:
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --share=network
  - --device=dri
  - --filesystem=xdg-config/fontconfig:ro
  - --filesystem=~/.fonts:ro
  - --talk-name=org.a11y.Bus
  - --socket=fallback-x11

modules:
  - name: uniplan
    buildsystem: simple
    build-commands:
      - ar x Uniplan_0.0.1_amd64.deb
      - tar xf data.tar.*
      - install -Dm755 usr/bin/uniplan /app/bin/uniplan
      - install -Dm644 org.dstudios.uniplan.png /app/share/icons/hicolor/512x512/apps/org.dstudios.uniplan.png
      - install -Dm644 org.dstudios.uniplan.desktop /app/share/applications/org.dstudios.uniplan.desktop
      - install -Dm644 org.dstudios.uniplan.metainfo.xml /app/share/metainfo/org.dstudios.uniplan.metainfo.xml
      - install -Dm0644 LICENSE -t /app/share/licenses/org.dstudios.uniplan/
    sources:
      - type: file
        only-arches: [x86_64]
        url: https://github.com/dStudios-735453/UniPlan_Releases/releases/download/v20.05.2026-1728_linux/Uniplan_0.0.1_amd64.deb
        sha256: b1bcf9ad3a49b2cd7d066acbf97725ca579a422d3ca6189300559f4672c50978
        dest-filename: Uniplan_0.0.1_amd64.deb
      #- type: file
      #  only-arches: [aarch64]
      #  url: will be added
      #  sha256: xxxxxxxx
      #  dest-filename: Uniplan_0.0.1_arm64.deb
      - type: file
        path: org.dstudios.uniplan.png
      - type: file
        path: org.dstudios.uniplan.desktop
      - type: file
        path: org.dstudios.uniplan.metainfo.xml
      - type: file
        path: LICENSE
